<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In – DevConnect</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <img src="/assets/logo-icon.png" alt="DevConnect Logo" class="navbar-logo" />
        <span class="navbar-brand-text">DevConnect</span>
      </a>
      <div class="navbar-nav" id="nav-links"></div>
    </div>
  </nav>

  <div class="auth-shell">
    <div class="auth-panel">
      <a href="/" class="auth-logo">
        <img src="/assets/logo-icon.png" alt="DevConnect Logo" class="auth-logo-img" />
        <span class="auth-brand-text">DevConnect</span>
      </a>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to your DevConnect account.</p>

      <div class="alert" id="msg"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="alice@college.edu" required autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="Your password" required autocomplete="current-password" />
            <button type="button" class="pw-toggle" id="pw-toggle-login" data-target="password"
              aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <div style="margin-top:6px;text-align:right;">
            <a href="/forgot-password.html" style="font-size:13px;color:var(--text-2);">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn" style="margin-top:4px;">
          Log in
        </button>
      </form>

      <div class="divider-label">don't have an account?</div>

      <a href="/register.html" class="btn btn-secondary btn-block">Create an account</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    renderNavbar();
    initPasswordToggle('pw-toggle-login');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      setLoading(btn, true, 'Log in');
      hideAlert('msg');

      const { data, error } = await api.post('/api/auth/login', { email, password });

      setLoading(btn, false, 'Log in');

      if (error) {
        showAlert('msg', error, 'error');
      } else {
        window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>

</html>
