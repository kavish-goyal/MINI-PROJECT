<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConnect - Create Post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">Dev<span>Connect</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="create-post.html" class="active">Create Post</a></li>
                <li><a href="requests.html">Requests</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            
            <div style="max-width: 600px; margin: 0 auto;">
                <div class="card">
                    <div class="card-header">
                        <h2>Find Your Teammates</h2>
                        <p style="margin-bottom: 0;">Create a post to find the right people for your project.</p>
                    </div>

                    <form action="explore.html" method="get">
                        <div class="form-group mt-md">
                            <label for="projectName">Project Name</label>
                            <input type="text" id="projectName" placeholder="e.g. Smart Campus App" required>
                        </div>

                        <div class="form-group">
                            <label for="projectType">Hackathon / Project Type</label>
                            <input type="text" id="projectType" placeholder="e.g. HealthTech 2024 or Final Year Project" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" placeholder="Describe what you are building and what kind of teammates you need..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="skills">Skills Required (Comma separated)</label>
                            <input type="text" id="skills" placeholder="e.g. HTML, CSS, JavaScript" required>
                        </div>

                        <div class="form-group">
                            <label for="members">Number of Members Needed</label>
                            <select id="members" required>
                                <option value="" disabled selected>Select number of members</option>
                                <option value="1">1 Member</option>
                                <option value="2">2 Members</option>
                                <option value="3">3 Members</option>
                                <option value="4+">4+ Members</option>
                            </select>
                        </div>

                        <div class="flex gap-sm mt-lg">
                            <button type="submit" class="btn btn-primary" style="flex: 1;">Post Requirement</button>
                            <a href="explore.html" class="btn btn-outline" style="flex: 1;">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
