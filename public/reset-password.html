<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – DevConnect</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <img src="/assets/logo-icon.png" alt="DevConnect Logo" class="navbar-logo" />
        <span class="navbar-brand-text">DevConnect</span>
      </a>
      <div class="navbar-nav" id="nav-links"></div>
    </div>
  </nav>

  <div class="auth-shell">
    <div class="auth-panel">
      <a href="/" class="auth-logo">
        <img src="/assets/logo-icon.png" alt="DevConnect Logo" class="auth-logo-img" />
        <span class="auth-brand-text">DevConnect</span>
      </a>

      <h1 class="auth-title">Choose a new password</h1>
      <p class="auth-sub">Set a new password for your DevConnect account.</p>

      <div class="alert" id="msg"></div>

      <!-- Invalid token state -->
      <div id="invalid-token" class="hidden" style="text-align:center;padding:24px 0;">
        <p style="color:var(--red);margin-bottom:16px;">This reset link is invalid or has expired.</p>
        <a href="/forgot-password.html" class="btn btn-secondary">Request a new link</a>
      </div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">
            New password
            <span class="hint">(min 8 characters)</span>
          </label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="New password" required autocomplete="new-password" />
            <button type="button" class="pw-toggle" id="pw-new" data-target="password" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" placeholder="Repeat password" required autocomplete="new-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          Reset password
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    renderNavbar();
    initPasswordToggle('pw-new');

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('reset-form').classList.add('hidden');
      document.getElementById('invalid-token').classList.remove('hidden');
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        showAlert('msg', 'Passwords do not match.', 'error');
        return;
      }

      setLoading(btn, true, 'Reset password');
      hideAlert('msg');

      const { data, error } = await api.post('/api/auth/reset-password', { token, password });

      setLoading(btn, false, 'Reset password');

      if (error) {
        showAlert('msg', error, 'error');
      } else {
        showAlert('msg', data.message + ' Redirecting to login…', 'success');
        setTimeout(() => { window.location.href = '/login.html'; }, 2000);
      }
    });
  </script>
</body>

</html>
