<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – DevConnect</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <img src="/assets/logo-icon.png" alt="DevConnect Logo" class="navbar-logo" />
        <span class="navbar-brand-text">DevConnect</span>
      </a>
      <div class="navbar-nav" id="nav-links"></div>
    </div>
  </nav>

  <div class="auth-shell">
    <div class="auth-panel">
      <a href="/" class="auth-logo">
        <img src="/assets/logo-icon.png" alt="DevConnect Logo" class="auth-logo-img" />
        <span class="auth-brand-text">DevConnect</span>
      </a>

      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send a reset link. It expires in 15 minutes.</p>

      <div class="alert" id="msg"></div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="alice@college.edu" required autocomplete="email" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          Send reset link
        </button>
      </form>

      <div class="divider-label">remembered it?</div>

      <a href="/login.html" class="btn btn-secondary btn-block">Back to log in</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    renderNavbar();

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();

      setLoading(btn, true, 'Send reset link');
      hideAlert('msg');

      const { data, error } = await api.post('/api/auth/forgot-password', { email });

      setLoading(btn, false, 'Send reset link');

      if (error) {
        showAlert('msg', error, 'error');
      } else {
        showAlert('msg', data.message, 'success');
        document.getElementById('forgot-form').reset();
      }
    });
  </script>
</body>

</html>
