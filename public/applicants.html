<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applicants – DevConnect</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <img src="/assets/logo-icon.png" alt="DevConnect Logo" class="navbar-logo" />
        <span class="navbar-brand-text">DevConnect</span>
      </a>
      <div class="navbar-nav" id="nav-links"></div>
      <button class="nav-toggle" id="mobile-menu-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile nav -->
  <div class="mobile-nav" id="mobile-nav">
    <div class="mobile-nav-backdrop" id="mobile-backdrop"></div>
    <div class="mobile-nav-panel">
      <div class="mobile-nav-close">
        <span class="navbar-brand">DevConnect</span>
        <button id="mobile-close" class="btn-ghost">✕</button>
      </div>
      <div id="mobile-nav-links"></div>
    </div>
  </div>

  <div class="wrap page-body">

    <a href="/dashboard.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7" />
      </svg>
      Back to dashboard
    </a>

    <!-- Loading -->
    <div id="loading">
      <div class="spinner"></div>
    </div>

    <!-- Content -->
    <div id="content" class="hidden">

      <div style="margin-bottom:24px;">
        <h1 id="project-name" style="font-size:26px;font-weight:700;letter-spacing:-0.015em;"></h1>
        <p class="t-sm t-muted" id="project-meta" style="margin-top:4px;"></p>
      </div>

      <div class="alert" id="msg"></div>

      <div id="apps-loading">
        <div class="spinner"></div>
      </div>
      <div class="applicant-list" id="apps-list"></div>
      <div class="empty hidden" id="apps-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 00-3-3.87" />
          <path d="M16 3.13a4 4 0 010 7.75" />
        </svg>
        <p>No applications yet. Share your project to attract applicants.</p>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id') || params.get('projectId');
    if (!projectId) window.location.href = '/dashboard.html';

    const statusPillMap = {
      accepted: 'pill-green',
      rejected: 'pill-red',
      withdrawn: 'pill-default',
      pending: 'pill-amber',
    };

    function buildApplicantRow(app, project) {
      const spotsLeft = project.totalPositions - project.acceptedMembers.length;
      const isPending = app.status === 'pending';
      const canAccept = isPending && spotsLeft > 0;

      const row = document.createElement('div');
      row.className = 'applicant-row';
      row.dataset.id = app._id;

      const skills = (app.applicant?.skills || []).slice(0, 5);

      row.innerHTML = `
        <div class="applicant-top">
          <div class="applicant-identity">
            <div class="avatar avatar-md">${getInitials(app.applicant?.name || '?')}</div>
            <div>
              <div class="applicant-name">
                ${app.applicant?.name || 'Unknown'}
                ${app.roleApplied ? `<span class="pill pill-blue" style="margin-left:6px;font-size:11px;">🎯 ${app.roleApplied}</span>` : ''}
              </div>
              <div class="applicant-sub">${[app.applicant?.college, app.applicant?.branch].filter(Boolean).join(' · ')}</div>
              ${skills.length ? `<div class="tags" style="margin-top:6px;">${skills.map(s => `<span class="tag">${s}</span>`).join('')}</div>` : ''}
            </div>
          </div>
          <span class="pill ${statusPillMap[app.status] || 'pill-default'}">${app.status}</span>
        </div>

        <div class="applicant-message">${app.message}</div>

        <div class="applicant-actions">
          <a href="/profile.html?id=${app.applicant?._id}" class="btn btn-secondary btn-sm" target="_blank">View profile</a>
          ${app.applicant?.githubUrl ? `<a href="${app.applicant.githubUrl}"   target="_blank" rel="noopener" class="btn btn-ghost btn-sm">GitHub</a>` : ''}
          ${app.applicant?.linkedinUrl ? `<a href="${app.applicant.linkedinUrl}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">LinkedIn</a>` : ''}
          ${isPending ? `
            <button class="btn btn-success btn-sm accept-btn" data-id="${app._id}" ${!canAccept ? 'disabled title="Team is full"' : ''}>
              Accept
            </button>
            <button class="btn btn-danger btn-sm reject-btn" data-id="${app._id}">Reject</button>
          ` : ''}
        </div>`;
      return row;
    }

    async function loadApplicants() {
      const user = await renderNavbar();
      if (!user) { window.location.href = '/login.html'; return; }

      const { data, error } = await api.get(`/api/applications/project/${projectId}`);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').classList.remove('hidden');
      document.getElementById('apps-loading').style.display = 'none';

      if (error) { showAlert('msg', error, 'error'); return; }

      const project = data.project;
      document.title = `Applicants – ${project.title}`;
      document.getElementById('project-name').textContent = project.title;
      document.getElementById('project-meta').textContent =
        `${project.acceptedMembers.length} / ${project.totalPositions} positions filled · Status: ${project.status}`;

      if (data.applications.length === 0) {
        document.getElementById('apps-empty').classList.remove('hidden');
        return;
      }

      const list = document.getElementById('apps-list');
      data.applications.forEach(app => list.appendChild(buildApplicantRow(app, project)));

      // Accept / Reject delegation
      list.addEventListener('click', async e => {
        const btn = e.target;
        const appId = btn.dataset.id;

        if (btn.classList.contains('accept-btn')) {
          if (!confirm('Accept this applicant?')) return;
          btn.disabled = true;
          const { error } = await api.post(`/api/applications/${appId}/accept`);
          if (error) { showAlert('msg', error, 'error'); btn.disabled = false; }
          else { showAlert('msg', 'Applicant accepted.', 'success'); setTimeout(() => location.reload(), 900); }
        }

        if (btn.classList.contains('reject-btn')) {
          if (!confirm('Reject this applicant?')) return;
          btn.disabled = true;
          const { error } = await api.post(`/api/applications/${appId}/reject`);
          if (error) { showAlert('msg', error, 'error'); btn.disabled = false; }
          else { showAlert('msg', 'Application rejected.', 'info'); setTimeout(() => location.reload(), 900); }
        }
      });
    }

    loadApplicants();
  </script>
</body>

</html>
